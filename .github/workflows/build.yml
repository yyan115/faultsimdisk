name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic kmod shellcheck

      - name: Lint scripts
        run: shellcheck scripts/dev.sh scripts/smoke-test.sh scripts/fault-test.sh scripts/stats-test.sh

      - name: Build module
        shell: bash
        run: |
          kdir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$kdir"
          make KDIR="$kdir"
          modinfo ./faultsimdisk.ko
