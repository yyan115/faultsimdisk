name: Runtime Integration

on:
  push:
    branches:
      - main
    paths:
      - faultsimdisk.c
      - Makefile
      - dkms.conf
      - VERSION
      - scripts/**
      - .github/workflows/runtime.yml
  pull_request:
    paths:
      - faultsimdisk.c
      - Makefile
      - dkms.conf
      - VERSION
      - scripts/**
      - .github/workflows/runtime.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-validation:
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Capture runner environment
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -r)"
            echo "architecture=$(uname -m)"
          } | tee runtime-environment.txt

      - name: Install integration dependencies
        shell: bash
        run: |
          sudo apt-get update
          if ! test -e "/lib/modules/$(uname -r)/build"; then
            sudo apt-get install -y "linux-headers-$(uname -r)"
          fi
          sudo apt-get install -y fio sqlite3 python3 e2fsprogs postgresql postgresql-client
          {
            echo "fio_version=$(fio --version)"
            echo "sqlite_version=$(sqlite3 --version | awk '{print $1}')"
            echo "postgres_version=$(psql --version | sed 's/^psql (PostgreSQL) //')"
            echo "gcc_version=$(gcc -dumpfullversion)"
          } | tee -a runtime-environment.txt

      - name: Build for runner kernel
        run: make

      - name: Run full validation
        shell: bash
        run: |
          cleanup() { sudo rmmod faultsimdisk 2>/dev/null || true; }
          trap cleanup EXIT
          ./scripts/dev.sh load 256
          ./scripts/dev.sh validate 2>&1 | tee validation-output.txt
          ./scripts/dev.sh unload
          trap - EXIT

      - name: Render verification report
        shell: bash
        run: |
          python3 scripts/render-results.py \
            --environment runtime-environment.txt \
            --validation validation-output.txt \
            --output-dir site

      - name: Package runtime evidence
        shell: bash
        run: |
          mkdir -p site/raw
          cp runtime-environment.txt validation-output.txt site/raw/
          sha256sum \
            runtime-environment.txt \
            validation-output.txt \
            site/latest.json \
            site/latest.md \
            site/latest.svg | tee evidence.sha256
          cp evidence.sha256 site/raw/
          tar -czf runtime-evidence.tar.gz \
            runtime-environment.txt \
            validation-output.txt \
            evidence.sha256 \
            site/latest.json \
            site/latest.md \
            site/latest.svg

      - name: Upload runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-integration-evidence
          path: |
            runtime-environment.txt
            validation-output.txt
            evidence.sha256
            runtime-evidence.tar.gz
            site/latest.json
            site/latest.md
            site/latest.svg
          if-no-files-found: error
          retention-days: 30

      - name: Attest runtime evidence
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime-evidence.tar.gz

      - name: Publish latest verified results
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_dir=$(mktemp -d)
          cp -a site/. "$publish_dir/"
          cd "$publish_dir"
          git init -b validation-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "validation: ${GITHUB_SHA::12}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin validation-results
