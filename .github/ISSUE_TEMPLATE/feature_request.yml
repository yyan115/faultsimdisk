name: Feature request
description: Propose a fault model, control, test, or driver improvement
title: "[Feature] "
labels:
  - "enhancement"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What storage-failure scenario is difficult to reproduce today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
